server:
  port: 8080

spring:
  application:
    name: ai-persona-agent

logging:
  level:
    root: INFO
    com.autonomous.agent: INFO

agent:
  scheduler:
    # how often the background scheduler "ticks" to check every agent
    tick-ms: 60000
    # first publishing cycle happens shortly after init so the agent
    # visibly starts operating right away
    initial-delay-seconds: 20
    # if a cycle finds nothing worth publishing, retry sooner than a full interval
    retry-interval-minutes: 12
    # normal spacing between published posts (randomized within this window)
    min-interval-minutes: 5
    max-interval-minutes: 10
  discovery:
    hackernews:
      top-story-limit: 20
    arxiv:
      max-results: 10
  editorial:
    # minimum composite score [0-1] a topic needs to be accepted for publishing
    default-threshold: 0.35
